name: Build and Deploy to Release Branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Generate release package.json
        run: |
          node -e "
            const pkg = require('./package.json');
            const release = {};
            const fields = [
              'name',
              'version',
              'description',
              'license',
              'type',
              'exports',
              'engines',
              'peerDependencies',
              'peerDependenciesMeta'
            ];
            for (const field of fields) {
              if (pkg[field] !== undefined) {
                release[field] = pkg[field];
              }
            }
            require('fs').writeFileSync(
              'release-package.json',
              JSON.stringify(release, null, 2) + '\n'
            );
          "

      - name: Assemble release-build directory
        run: |
          mkdir -p release-build
          cp -r dist release-build/
          cp release-package.json release-build/package.json
          [ -f README.md ] && cp README.md release-build/ || true
          [ -f LICENSE ] && cp LICENSE release-build/ || true

      - name: Force push to release branch
        run: |
          cd release-build
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v${{ steps.pkg.outputs.version }}"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:release
